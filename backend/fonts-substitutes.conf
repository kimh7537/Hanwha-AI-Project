<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  원본 PPTX 가 쓰는 윈도우 폰트를 컨테이너에 있는 폰트로 고정한다.

  왜 필요한가. 슬라이드 이미지는 LibreOffice 가 굽고(app/services/render_slides.py),
  LibreOffice 는 없는 폰트를 fontconfig 가 고르는 아무 폰트로 바꾼다. 그 폰트의 글자 폭이
  원본과 다르면 상자에 맞춰 짜 둔 글이 그대로 줄바꿈되어, 실제 배포에서 '92,929' 가
  '92,92 / 9' 로, '2Q25' 가 '2Q2 / 5' 로 쪼개져 나왔다.

  폭을 실제로 재서 골랐다 (기준: Malgun Gothic = 1.00).
    '92,929' 45pt  나눔고딕 1.12 · Noto Sans CJK KR 1.03
    '21,075' 20pt  나눔고딕 1.11 · Noto Sans CJK KR 1.01
  한글은 두 폰트 다 원본보다 좁아 문제가 없었고, 깨진 것은 전부 숫자였다.
  나눔고딕은 라틴·숫자가 넓어 이 자료에 맞지 않는다.

  Arial·Times New Roman·Calibri·Cambria 는 fontconfig 의 30-metric-aliases.conf 가
  Liberation/Carlito/Caladea 로 이미 이어 준다 — 그 폰트들을 설치하기만 하면 된다
  (Dockerfile). 여기서는 그 표에 없는 한국어 폰트만 다룬다.

  mode="append" 인 이유: 진짜 폰트가 설치된 환경이라면 그쪽이 먼저 쓰이고, 없을 때만
  아래 대체가 쓰인다. 개발기(윈도우)와 배포기에서 규칙이 서로 다른 결과를 내지 않는다.
-->
<fontconfig>
  <match target="pattern">
    <test name="family"><string>Malgun Gothic</string></test>
    <edit name="family" mode="append" binding="same">
      <string>Noto Sans CJK KR</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family"><string>맑은 고딕</string></test>
    <edit name="family" mode="append" binding="same">
      <string>Noto Sans CJK KR</string>
    </edit>
  </match>

  <!-- Semilight 는 별도 패밀리로 잡혀 있어 따로 이어 준다. 굵기 차이보다 폭이 중요하다. -->
  <match target="pattern">
    <test name="family"><string>Malgun Gothic Semilight</string></test>
    <edit name="family" mode="append" binding="same">
      <string>Noto Sans CJK KR</string>
    </edit>
  </match>

  <!-- 바탕/굴림 계열은 명조·고딕으로 나눠 받는다. -->
  <match target="pattern">
    <test name="family"><string>Batang</string></test>
    <edit name="family" mode="append" binding="same">
      <string>Noto Serif CJK KR</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family"><string>바탕</string></test>
    <edit name="family" mode="append" binding="same">
      <string>Noto Serif CJK KR</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family"><string>Gulim</string></test>
    <edit name="family" mode="append" binding="same">
      <string>Noto Sans CJK KR</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family"><string>굴림</string></test>
    <edit name="family" mode="append" binding="same">
      <string>Noto Sans CJK KR</string>
    </edit>
  </match>

  <!-- 한국어 기본 글꼴도 Noto 로 둔다. 이름을 못 읽은 런이 나눔고딕으로 떨어지지 않게. -->
  <match target="pattern">
    <test name="lang"><string>ko</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="same">
      <string>Noto Sans CJK KR</string>
    </edit>
  </match>
</fontconfig>
