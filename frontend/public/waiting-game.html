<!doctype html><html lang="ko"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>극악 이모지 영화 퀴즈</title><style>body{margin:0;background:linear-gradient(135deg,#17152c,#5145a8);font-family:system-ui,'Noto Sans KR',sans-serif;color:#242239;min-height:100vh;display:grid;place-items:center;padding:16px}.wrap{width:min(100%,700px)}header{text-align:center;color:#fff;margin-bottom:16px}h1{margin:4px;font-size:clamp(28px,7vw,44px)}.card{background:#fffffff2;border-radius:24px;padding:clamp(20px,5vw,36px);box-shadow:0 20px 50px #09061866}.bar{display:flex;justify-content:space-between;color:#77738b;font-weight:700}.prog{height:8px;background:#e8e6f3;border-radius:9px;margin:12px 0 22px}.prog i{display:block;height:100%;background:#7162e8;border-radius:9px}.emoji{text-align:center;font-size:clamp(52px,13vw,88px);padding:25px 5px;background:#f2f0ff;border-radius:18px}.q{text-align:center;font-weight:800;margin:18px 0 10px}.form{display:flex;gap:8px}.form input{flex:1;min-width:0;padding:13px;border:2px solid #e2dfef;border-radius:11px;font-size:16px}.form button,.next,.restart{border:0;border-radius:11px;padding:0 17px;background:#242239;color:#fff;font-weight:800;cursor:pointer}.msg{text-align:center;min-height:25px;margin:10px 0;font-weight:700}.wrong{color:#d44860}.good{color:#17966e}.hint,.explain{display:none;padding:12px;border-radius:10px;margin:8px auto;line-height:1.55}.hint.show{display:block;background:#fff1cf;color:#77570d}.explain.show{display:block;background:#e6faf2;border-left:4px solid #17966e}.explain strong{display:block;color:#168963}.next{display:none;margin:15px auto;padding:12px 20px}.next.show{display:block}.result{text-align:center;display:none}.result.show{display:block}.score{font-size:44px;color:#7162e8;font-weight:900}.restart{padding:12px 20px;background:#7162e8}@media(max-width:480px){.form{flex-direction:column}.form button{padding:13px}}
</style><main class="wrap"><header><small>EXTREME MOVIE EMOJI QUIZ</small><h1>극악 난도 영화 퀴즈</h1><div>이모지의 숨은 연결고리를 찾아보세요 · 문제당 2회</div></header><section class="card"><div id="quiz"><div class="bar"><span id="count"></span><span id="chance"></span></div><div class="prog"><i id="progress"></i></div><div class="emoji" id="emoji"></div><div class="q">이 영화의 제목은?</div><form class="form" id="form"><input id="answer" placeholder="영화 제목을 입력하세요" autocomplete="off"><button>확인</button></form><div id="msg" class="msg"></div><div id="hint" class="hint"></div><div id="explain" class="explain"></div><button id="next" class="next">다음 문제 →</button></div><div id="result" class="result"><h2>퀴즈 완료!</h2><div id="score" class="score"></div><p id="resultMsg"></p><button id="restart" class="restart">다시 도전</button></div></section></main><script>
const data=[['❄️ 👭 👑','겨울왕국','ㄱㅇㅇㄱ','눈과 얼음, 자매, 왕국의 조합이에요.'],['🏞️ 🪖 🌽 🐔','웰컴투 동막골','ㅇㅋㅌ ㄷㅁㄱ','산골 마을에 남북 군인들이 모이는 이야기예요.'],['🏠 🪜 🪳 💰','기생충','ㄱㅅㅊ','계단으로 대비되는 두 가족과 기생 관계를 상징해요.'],['🕷️ 🕸️ 🏙️ 🦸','스파이더맨','ㅅㅍㅇㄷㅁ','거미와 거미줄, 도시의 영웅을 표현했어요.'],['🎹 🎺 💃 🌆','라라랜드','ㄹㄹㄹㄷ','재즈와 춤, 별빛 아래의 꿈과 사랑을 나타내요.'],['🧲 🥫 🫀 🔧','아이언맨','ㅇㅇㅁ','자기장, 금속 슈트, 가슴의 아크 리액터, 공구로 토니 스타크를 암시해요.'],['🪵 🐴 🌊 🧿','오디세이','ㅇㄷㅅㅇ','목마, 긴 항해, 바다, 귀환의 부적을 통해 고대 영웅의 귀향을 암시해요.']];let i=0,tries=0,score=0,$=s=>document.querySelector(s),clean=s=>s.toLowerCase().replace(/[\s!！。，,.?？·]/g,'');function load(){let d=data[i];tries=0;$('#count').textContent=`문제 ${i+1} / ${data.length}`;$('#chance').textContent='남은 기회 2회';$('#progress').style.width=(i+1)/data.length*100+'%';$('#emoji').textContent=d[0];$('#answer').value='';$('#answer').disabled=false;$('#msg').textContent='';$('#msg').className='msg';$('#hint').className='hint';$('#hint').textContent='';$('#explain').className='explain';$('#explain').innerHTML='';$('#next').className='next';$('#answer').focus()}$('#form').onsubmit=e=>{e.preventDefault();let d=data[i],g=clean($('#answer').value);if(!g)return;tries++;if(clean(d[1])===g){score++;$('#msg').textContent='정답이에요! 🎉';$('#msg').className='msg good';$('#explain').innerHTML='<strong>정답: '+d[1]+'</strong>'+d[3];$('#explain').className='explain show';$('#answer').disabled=true;$('#next').className='next show'}else if(tries===1){$('#chance').textContent='남은 기회 1회';$('#msg').textContent='틀렸습니다. 극악 힌트를 확인하세요.';$('#msg').className='msg wrong';$('#hint').textContent='초성 힌트: '+d[2];$('#hint').className='hint show';$('#answer').value='';$('#answer').focus()}else{$('#chance').textContent='남은 기회 0회';$('#msg').textContent='정답: '+d[1];$('#msg').className='msg wrong';$('#hint').textContent='초성 힌트: '+d[2];$('#hint').className='hint show';$('#explain').innerHTML='<strong>해설</strong>'+d[3];$('#explain').className='explain show';$('#answer').disabled=true;$('#next').className='next show'}};$('#next').onclick=()=>{i++;if(i<data.length)load();else{$('#quiz').style.display='none';$('#result').className='result show';$('#score').textContent=score+' / '+data.length;$('#resultMsg').textContent=score===data.length?'전 문제 정답! 영화 추리의 신입니다.':'해설을 읽고 다시 도전해 보세요.'}};$('#restart').onclick=()=>{i=score=0;$('#quiz').style.display='block';$('#result').className='result';load()};load();
</script></html>
